<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pure SaaS — Build Better SaaS Websites with AI Coding Agents</title>
    <meta name="description" content="Pure SaaS helps AI coding agents build and improve SaaS interfaces using reusable design guidance, components and practical workflows for Claude Code, Cursor, Windsurf, Copilot, and Gemini." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563eb' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polygon points='12 2 2 7 12 12 22 7 12 2'/><polyline points='2 17 12 22 22 17'/><polyline points='2 12 12 17 22 12'/></svg>" />
    <!-- Single Consistent Typographic Family (Inter + JetBrains Mono for Code) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..800;1,14..32,300..800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <!-- Theme Flash Prevention -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('pure-saas-theme');
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved === 'dark' || (!saved && systemDark) ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-canvas text-text-primary antialiased selection:bg-accent/20 selection:text-accent min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
