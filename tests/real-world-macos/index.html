<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zenith Notes — macOS Desktop Productivity</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="macos-window" role="application" aria-label="Zenith Notes macOS Application">
    <!-- Window Titlebar & Toolbar -->
    <header class="window-titlebar">
      <div class="traffic-lights" aria-label="Window Management">
        <span class="traffic-dot dot-close" title="Close"></span>
        <span class="traffic-dot dot-minimize" title="Minimize"></span>
        <span class="traffic-dot dot-zoom" title="Zoom"></span>
      </div>

      <div class="window-title">Zenith Notes</div>

      <div class="toolbar-actions">
        <!-- Apple HIG Segmented Control -->
        <div class="segmented-control" role="tablist" aria-label="View Mode Filter">
          <button class="segment-btn active" role="tab" aria-selected="true" id="seg-all" data-filter="all">All Notes</button>
          <button class="segment-btn" role="tab" aria-selected="false" id="seg-pinned" data-filter="pinned">Pinned</button>
          <button class="segment-btn" role="tab" aria-selected="false" id="seg-archive" data-filter="archive">Archive</button>
        </div>

        <input type="search" class="search-input" id="search-input" placeholder="Search (⌘F)" aria-label="Filter notes">

        <button class="btn-icon" id="btn-new-note" aria-label="Create New Note (⌘N)">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>New Note</span>
        </button>
      </div>
    </header>

    <!-- Split View Window Body -->
    <div class="window-body">
      <!-- Sidebar Navigation -->
      <nav class="sidebar" aria-label="Sidebar Navigation">
        <div>
          <div class="sidebar-group-label">Library</div>
          <ul class="sidebar-list">
            <li class="sidebar-item active" data-folder="all">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
              </svg>
              <span>All Notes</span>
              <span class="sidebar-item-count" id="count-all">3</span>
            </li>
            <li class="sidebar-item" data-folder="work">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
              </svg>
              <span>Work</span>
              <span class="sidebar-item-count" id="count-work">2</span>
            </li>
            <li class="sidebar-item" data-folder="personal">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
              <span>Personal</span>
              <span class="sidebar-item-count" id="count-personal">1</span>
            </li>
          </ul>
        </div>
      </nav>

      <!-- Note List Pane -->
      <section class="notes-pane" id="notes-list" role="listbox" aria-label="Notes List">
        <!-- Rendered by app.js -->
      </section>

      <!-- Note Editor / Detail Pane -->
      <main class="editor-pane" id="note-detail" aria-label="Active Note View">
        <header class="editor-header">
          <h1 class="editor-title" id="active-title">Select a Note</h1>
          <div class="editor-meta" id="active-meta">Select a note from the list to view its contents</div>
        </header>
        <div class="editor-content" id="active-body">
          <p>Zenith Notes supports full keyboard navigation and authentic Apple HIG interactions.</p>
        </div>
        <div class="shortcut-hint">
          <span>⌘N: New Note</span>
          <span>⌘F: Quick Search</span>
          <span>↑/↓: Traverse Notes</span>
        </div>
      </main>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
