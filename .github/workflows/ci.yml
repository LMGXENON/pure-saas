name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run Test Suite
        run: npm test

      - name: Validate Starter Templates & Fixtures
        run: |
          node scripts/pure-saas.mjs validate references/templates/DESIGN.md
          node scripts/pure-saas.mjs validate tests/fixtures/valid-design.md

